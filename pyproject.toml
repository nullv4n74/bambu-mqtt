[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-mqtt"
version = "0.1.0"
description = "Bambu Lab MQTT telemetry listener"
requires-python = ">=3.14"
dependencies = [
    "paho-mqtt",
    "cryptography",
]

[tool.setuptools.packages.find]
include = ["bambu_mqtt*"]